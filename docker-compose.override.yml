services:
      dev:
        build: .
        command: ["sh", "-c", "npm run dev -- --port 3000 -H 0.0.0.0"]
        ports: ["3001:3000"]
        depends_on:
          postgres:
            condition: service_healthy
          seaweedfs:
            condition: service_healthy
          seed:
            condition: service_completed_successfully
        environment:
          DATABASE_URL: postgres://dogfood:dogfood@postgres:5432/dogfood
          S3_ENDPOINT: http://seaweedfs:8333
          S3_ACCESS_KEY: dogfood
          S3_SECRET_KEY: dogfoodlocal
          S3_BUCKET: dogfood-assets
          S3_REGION: us-east-1
          SEAWEEDFS_FILER_URL: http://seaweedfs:8888
          OFFLINE_MODE: "true"
          NODE_ENV: development
          PORT: "3000"
          APP_URL: http://localhost:3001
          SESSION_SECRET: docker-container-super-secret-key-32chars
        volumes:
          - .:/app
          - /app/node_modules
          - /app/.next